packages:
  - "pkg/*"

packageExtensions:
  "@config-plugins/react-native-pdf@*":
    dependencies:
      "@expo/config-plugins": "^56"
  # The worklets Babel plugin imports these packages but 0.8.3 does not declare them.
  "react-native-worklets@0.8.3":
    dependencies:
      "@babel/generator": "7.29.7"
      "@babel/traverse": "7.29.7"
      "@babel/types": "7.29.7"

allowBuilds:
  "@posthog/cli": true
  core-js: false
  esbuild: false
  msw: false

overrides:
  # better-auth 1.7 refuses a password that its own `hashPassword` had just produced, failing
  # sign-in for every seeded account — and existing hashes were written by 1.6. Held here rather
  # than by pinning four manifests, because `^1.6.23` happily resolves 1.7 and silently would.
  better-auth: 1.6.23
  # A peer of the adapter and expo packages, so it floats to 1.7 on its own if left out.
  "@better-auth/core": 1.6.23
  "@better-auth/drizzle-adapter": 1.6.23
  "@better-auth/expo": 1.6.23
  # One esbuild for the whole tree. Without this, drizzle-kit, tsx and Vite each bring their
  # own — four copies, four platform binaries — and every consumer accepts this one.
  esbuild: 0.28.2
  # patch-package asks for ^0.0.33, from long before tmp closed its symlink escape.
  tmp: 0.2.7
  # xcode asks for ^7.
  uuid: 11.1.1
