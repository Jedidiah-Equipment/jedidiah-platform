packages:
  - "pkg/*"

packageExtensions:
  "@config-plugins/react-native-pdf@*":
    dependencies:
      "@expo/config-plugins": "^57"
  # The worklets Babel plugin imports these packages but 0.10.1 does not declare them. Pin them to
  # the Babel 7.29.7 that @babel/core anchors for Expo, and keep the key version-scoped so an SDK
  # move forces us to re-check upstream rather than preserve a stale patch.
  "react-native-worklets@0.10.1":
    dependencies:
      "@babel/generator": "7.29.7"
      "@babel/traverse": "7.29.7"

allowBuilds:
  "@posthog/cli": true
  core-js: false
  esbuild: false
  msw: false

overrides:
  # One esbuild for the whole tree. Without this, drizzle-kit, tsx and Vite each bring their
  # own — four copies, four platform binaries — and every consumer accepts this one.
  esbuild: 0.28.2
  # patch-package asks for ^0.0.33, from long before tmp closed its symlink escape.
  tmp: 0.2.7
  # xcode asks for ^7.
  uuid: 11.1.1
