packages:
  - "pkg/*"

packageExtensions:
  # This release imports Expo config plugins without declaring the dependency.
  "@config-plugins/react-native-pdf@14.0.2":
    dependencies:
      "@expo/config-plugins": "^57"
  # Expo 57 needs Worklets 0.10, whose Babel plugin still omits these dependencies.
  "react-native-worklets@0.10.4":
    dependencies:
      "@babel/generator": "7.29.7"
      "@babel/traverse": "7.29.7"

allowBuilds:
  "@posthog/cli": true
  "@railway/cli": true
  core-js: false
  esbuild: false
  msw: false

overrides:
  # One esbuild for the whole tree. Without this, drizzle-kit, tsx and Vite each bring their
  # own — four copies, four platform binaries — and every consumer accepts this one.
  esbuild: 0.28.2
  # Expo's cyclic peers otherwise auto-install a second Reanimated beyond Expo 57's Worklets range.
  react-native-reanimated: 4.5.5
  # patch-package asks for ^0.0.33, from long before tmp closed its symlink escape.
  "patch-package>tmp": 0.2.7
  # xcode asks for ^7 and requires CommonJS; uuid 11 is the last CommonJS release.
  "xcode>uuid": 11.1.1

patchedDependencies:
  # NativeWind 4 otherwise shares generated styles across every concurrent export/build.
  react-native-css-interop@0.2.7: patches/react-native-css-interop@0.2.7.patch
