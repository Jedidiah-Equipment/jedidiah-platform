<!doctype html>
<!-- Throwaway arrival capture UI study: three layouts via ?variant=A|B|C and six examples via ?state=. No writes. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arrival capture · throwaway prototype</title>
    <link rel="stylesheet" href="/pkg/domain/fonts/geist-sans/geist.css" />
    <style>
      :root { color-scheme:dark; font-family:Geist,sans-serif; color:#f5f5f5; background:#090909; --panel:#1a1a1a; --field:#272727; --border:#414141; --muted:#a3a3a3; --yellow:#fff000; --warning:#fbbf6d; --warning-bg:#32271d; --warning-border:#865624; --green:#62d9ac; }
      * { box-sizing:border-box; }
      body { margin:0; min-width:320px; }
      button,input,textarea,select { font:inherit; }
      button { cursor:pointer; }
      button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:2px solid var(--yellow); outline-offset:2px; }
      .background { position:fixed; inset:0; padding:28px max(25px,calc((100vw - 1250px)/2)); opacity:.34; pointer-events:none; overflow:hidden; filter:blur(1px); }
      .app-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #3b3b3b; padding-bottom:18px; font-size:16px; font-weight:600; }
      .app-header small { color:#aaa; font-size:11px; }
      .app-card { margin-top:30px; border:1px solid #414141; background:#202020; padding:24px; border-radius:12px; }
      .app-card h2 { font-size:15px; margin:0 0 25px; }
      .fake-machines { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
      .fake-machine { min-height:295px; border:1px solid #555; border-radius:12px; padding:20px; }
      .fake-machine strong { display:block; margin-bottom:20px; }
      .fake-machine p { color:#bbb; }
      .veil { position:fixed; inset:0; background:#000a; }
      .study-control { position:fixed; z-index:3; top:16px; left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100vw - 24px); display:flex; align-items:center; gap:12px; border:1px dashed #777; background:#111; border-radius:9px; padding:7px 11px; box-shadow:0 3px 18px #000b; font-size:11px; }
      .study-control strong { color:var(--yellow); white-space:nowrap; }
      .study-control select { background:#252525; border:1px solid #555; border-radius:6px; color:white; padding:6px 8px; font-size:11px; min-width:160px; }
      .stage { position:fixed; inset:58px 0 68px; z-index:2; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:18px 16px 25px; }
      .dialog { width:100%; max-height:100%; overflow:auto; scrollbar-width:thin; background:var(--panel); border:1px solid #353535; border-radius:12px; box-shadow:0 25px 100px #000d; display:flex; flex-direction:column; }
      .dialog.a { max-width:424px; } .dialog.b { max-width:620px; } .dialog.c { max-width:690px; }
      .dialog-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:18px 18px 10px; }
      .dialog-header h1 { margin:0; font-size:17px; font-weight:600; line-height:1.3; }
      .close { border:0; background:none; color:#eee; font-size:24px; line-height:19px; padding:0 2px; }
      .body { padding:7px 18px 18px; overflow:auto; }
      .footer { position:sticky; bottom:0; display:flex; align-items:center; justify-content:flex-end; gap:8px; border-top:1px solid #383838; background:#222; padding:14px 18px; }
      .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:34px; border:1px solid #505050; border-radius:7px; padding:7px 11px; background:#2a2a2a; color:#f1f1f1; font-size:12px; font-weight:500; white-space:nowrap; }
      .btn:hover { background:#333; }
      .btn.primary { border-color:var(--yellow); background:var(--yellow); color:#111; font-weight:600; }
      .btn.primary:disabled { opacity:.52; cursor:not-allowed; }
      .btn.ghost { border:0; background:transparent; color:#bcbcbc; padding:5px; min-height:auto; }
      .label { display:block; font-size:12px; font-weight:600; margin-bottom:7px; }
      .input { width:100%; border:1px solid #555; background:var(--field); color:#fff; border-radius:8px; min-height:37px; padding:8px 10px; font-size:14px; }
      .input::placeholder { color:#999; }
      textarea.input { min-height:70px; resize:vertical; }
      .number-wrap { position:relative; }
      .number-wrap .input { padding-right:33px; font-size:18px; font-weight:600; }
      .number-wrap span { position:absolute; right:11px; top:9px; color:#aaa; font-size:14px; }
      .meta { color:var(--muted); font-size:11px; line-height:1.4; }
      .subtle { color:var(--muted); }
      .photo-row { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
      .photo-tag { display:inline-flex; align-items:center; gap:6px; color:var(--green); border:1px solid #147b5e; background:#16392d; border-radius:999px; padding:4px 7px; font-size:11px; }
      .photo-remove { color:inherit; border:0; background:none; padding:0; line-height:1; }
      .photo-note { margin-top:5px; }
      .warn { color:var(--warning); }
      .warning-panel { border:1px solid var(--warning-border); background:var(--warning-bg); border-radius:8px; padding:10px; }
      .check { display:flex; align-items:flex-start; gap:9px; cursor:pointer; font-size:12px; line-height:1.45; }
      .check input { accent-color:var(--yellow); width:16px; height:16px; margin:1px 0 0; flex:none; }
      .check strong { display:block; font-weight:600; }
      .check small { color:#d9b98d; display:block; margin-top:2px; font-size:11px; }
      .ready { font-size:11px; color:var(--green); }
      .section-gap { margin-top:16px; }
      /* A — one compact meter block, with comparison and dispute in its boundary. */
      .a-reading-row { display:grid; grid-template-columns:minmax(92px,.85fr) 22px minmax(0,1.3fr); align-items:end; gap:8px; }
      .a-reading-row .label { min-height:16px; margin-bottom:7px; }
      .a-previous-value { display:flex; align-items:center; min-height:37px; font-size:18px; font-weight:600; white-space:nowrap; }
      .a-reading-arrow { width:20px; height:20px; margin-bottom:8px; color:#a3a3a3; }
      .a-under { margin-top:8px; }
      .a-dispute { margin-top:11px; }
      .a-photo { margin-top:15px; }
      /* B — explicit side-by-side comparison before the dispute decision. */
      .b-reading { display:grid; grid-template-columns:minmax(155px,.85fr) minmax(0,1.15fr); border:1px solid #484848; border-radius:9px; overflow:hidden; }
      .b-previous,.b-enter { padding:14px; }
      .b-previous { background:#232323; border-right:1px solid #484848; }
      .b-previous strong { display:block; margin-top:13px; font-size:22px; line-height:1; }
      .b-enter .label { margin-bottom:10px; }
      .b-relation { grid-column:1/-1; padding:10px 14px; border-top:1px solid #484848; background:#242424; font-size:11px; color:#bdbdbd; }
      .b-relation:has(.warning-panel) { background:var(--warning-bg); border-top-color:var(--warning-border); }
      .b-relation .warning-panel { border:0; background:transparent; padding:0; }
      .b-support { display:grid; grid-template-columns:1fr 1fr; gap:17px; margin-top:18px; }
      .b-support textarea.input { min-height:75px; }
      /* C — reading decision on the left, evidence and comment on the right. */
      .c-layout { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(230px,.9fr); gap:14px; }
      .c-reading { border:1px solid #494949; border-radius:9px; padding:14px; background:#202020; }
      .c-previous { display:flex; justify-content:space-between; gap:12px; border-top:1px solid #444; padding-top:11px; margin-top:14px; font-size:11px; }
      .c-previous strong { font-size:13px; }
      .c-dispute { margin-top:15px; }
      .c-support { border:1px solid #494949; border-radius:9px; padding:14px; }
      .c-support h2 { margin:0 0 10px; font-size:13px; font-weight:600; }
      .c-support textarea.input { min-height:104px; }
      .switcher { position:fixed; z-index:4; bottom:14px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:7px; background:#090909; border:1px solid #595959; border-radius:999px; padding:5px; box-shadow:0 8px 30px #000c; }
      .switcher button { width:33px; height:33px; border:0; border-radius:50%; background:#2b2b2b; color:#fff; font-size:19px; }
      .switcher button:hover { background:#444; }
      .switcher span { display:block; width:180px; text-align:center; font-size:11px; font-weight:600; }
      .switcher small { display:block; font-size:9px; color:var(--yellow); font-weight:500; }
      .toast { position:fixed; z-index:5; right:18px; bottom:75px; background:#262626; border:1px solid #555; border-radius:8px; padding:10px 13px; color:#ddd; font-size:12px; display:none; }
      @media(max-width:600px) { .study-control { left:12px; right:12px; transform:none; justify-content:space-between; } .stage { padding:8px 10px 18px; } .dialog.b,.dialog.c { max-width:424px; } .b-reading,.b-support,.c-layout { grid-template-columns:1fr; } .b-previous { border-right:0; border-bottom:1px solid #484848; } .b-relation { grid-column:1; } .c-support textarea.input { min-height:68px; } }
    </style>
  </head>
  <body>
    <div class="background" aria-hidden="true"><div class="app-header"><div>CJOB-00001 <small>Brett Green · Copperfield · Planting</small></div><small>Completed</small></div><div class="app-card"><h2>Machines</h2><div class="fake-machines"><div class="fake-machine"><strong>BEL14-1</strong><p>Planned · AFTAPKAR-1 · Andile S</p><p>Arrival · 100.0 h</p><p>Departure · 110.0 h</p></div><div class="fake-machine"><strong>BEL14-2</strong><p>Planned · Simthembile</p><p>Arrival · 120.0 h</p><p>Departure · 150.0 h</p></div></div></div></div>
    <div class="veil"></div>
    <div class="study-control"><strong>THROWAWAY · ARRIVAL CAPTURE</strong><label>Example <select id="state-select"></select></label></div>
    <div class="stage"><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div></div>
    <nav class="switcher" aria-label="Prototype variant"><button id="previous" type="button" aria-label="Previous option">←</button><span id="variant-label"></span><button id="next" type="button" aria-label="Next option">→</button></nav>
    <div id="toast" class="toast" role="status"></div>
    <script>
      const variants = { A:'Compact meter block', B:'Side-by-side comparison', C:'Reading + evidence columns' };
      const scenarios = {
        blank: { label:'Empty reading', latest:110, value:'', dispute:false, photo:false, comment:'' },
        valid: { label:'At or above previous · 112.0 h', latest:110, value:'112.0', dispute:false, photo:false, comment:'' },
        equal: { label:'Equal to previous · 110.0 h', latest:110, value:'110.0', dispute:false, photo:false, comment:'' },
        lower: { label:'Below previous · 105.0 h', latest:110, value:'105.0', dispute:false, photo:false, comment:'' },
        disputed: { label:'Previous reading disputed', latest:110, value:'105.0', dispute:true, photo:false, comment:'Previous departure was recorded incorrectly.' },
        'no-history': { label:'No earlier reading', latest:null, value:'42.0', dispute:false, photo:false, comment:'' },
        photo: { label:'Meter photo attached', latest:110, value:'112.0', dispute:false, photo:true, comment:'' },
      };
      const params = new URLSearchParams(location.search);
      let variant = variants[params.get('variant')] ? params.get('variant') : 'A';
      let scenario = scenarios[params.get('state')] ? params.get('state') : 'lower';
      let model = { ...scenarios[scenario] };
      const latestText = () => model.latest === null ? 'No earlier reading' : `${model.latest}.0 h`;
      const below = () => model.latest !== null && model.value !== '' && Number(model.value) < model.latest;
      const validNumber = () => model.value.trim() !== '' && Number.isFinite(Number(model.value)) && Number(model.value) >= 0;
      const canSave = () => validNumber() && (!below() || model.dispute);
      const escapeText = value => String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
      const numberInput = () => `<div class="number-wrap"><input id="value-input" class="input" aria-label="Hour meter value" inputmode="decimal" placeholder="0.0" value="${escapeText(model.value)}" /><span>h</span></div>`;
      const disputeChoice = () => below() ? `<div class="warning-panel"><label class="check"><input type="checkbox" id="dispute-input" ${model.dispute ? 'checked' : ''} /><span><strong>The previous reading is wrong</strong><small>Record ${escapeText(model.value)} h and dispute the ${latestText()} reading.</small></span></label></div>` : '';
      const photoPicker = () => `<div class="photo-row"><button class="btn" type="button" data-action="photo">▣ &nbsp;${model.photo ? 'Replace meter photo' : 'Attach meter photo'}</button>${model.photo ? '<span class="photo-tag">meter.jpg <button class="photo-remove" type="button" data-action="remove-photo" aria-label="Remove meter photo">×</button></span>' : ''}</div>`;
      const commentField = () => `<label class="label" for="comment-input">Comment (optional)</label><textarea id="comment-input" class="input" rows="3">${escapeText(model.comment)}</textarea>`;
      const photoHint = () => '<div class="meta photo-note">Optional · JPEG or PNG, up to 10 MB</div>';
      function variantA() {
        return `<div class="body"><div class="a-meter"><div class="a-reading-row"><div><span class="label">Previous reading</span><strong class="a-previous-value">${model.latest === null ? 'None' : latestText()}</strong></div><svg class="a-reading-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6" /></svg><div><label class="label" for="value-input">Current reading</label>${numberInput()}</div></div>${below() ? `<div class="a-dispute">${disputeChoice()}</div>` : ''}</div><div class="a-photo">${photoPicker()}${photoHint()}</div><div class="section-gap">${commentField()}</div></div>`;
      }
      function variantB() {
        return `<div class="body"><div class="b-reading"><div class="b-previous"><span class="meta">${model.latest === null ? 'READING HISTORY' : 'PREVIOUS READING'}</span><strong>${latestText()}</strong></div><div class="b-enter"><label class="label" for="value-input">New hour meter value</label>${numberInput()}</div>${below() ? `<div class="b-relation">${disputeChoice()}</div>` : ''}</div><div class="b-support"><div><label class="label">Meter photo</label>${photoPicker()}${photoHint()}</div><div>${commentField()}</div></div></div>`;
      }
      function variantC() {
        return `<div class="body"><div class="c-layout"><section class="c-reading"><label class="label" for="value-input">Hour meter value</label>${numberInput()}<div class="c-previous"><span>${model.latest === null ? 'Reading history' : 'Previous reading'}</span><strong>${latestText()}</strong></div>${below() ? `<div class="c-dispute">${disputeChoice()}</div>` : ''}</section><section class="c-support"><h2>Evidence and note</h2>${photoPicker()}${photoHint()}<div class="section-gap">${commentField()}</div></section></div></div>`;
      }
      function setParams() { const next = new URLSearchParams(location.search); next.set('variant',variant); next.set('state',scenario); history.replaceState(null,'',`${location.pathname}?${next}`); }
      function render() {
        document.getElementById('dialog').className = `dialog ${variant.toLowerCase()}`;
        document.getElementById('dialog').innerHTML = `<header class="dialog-header"><h1 id="dialog-title">Capture arrival · BEL14-1</h1><button class="close" type="button" aria-label="Close prototype" data-action="close">×</button></header>${variant === 'A' ? variantA() : variant === 'B' ? variantB() : variantC()}<footer class="footer"><button class="btn" type="button" data-action="cancel">Cancel</button><button class="btn primary" type="button" data-action="save" ${canSave() ? '' : 'disabled'}>Save</button></footer>`;
        document.getElementById('state-select').innerHTML = Object.entries(scenarios).map(([key,data]) => `<option value="${key}" ${key === scenario ? 'selected' : ''}>${data.label}</option>`).join('');
        document.getElementById('variant-label').innerHTML = `<small>OPTION ${variant} OF 3</small>${variants[variant]}`;
        setParams();
      }
      function changeVariant(step) { const keys = Object.keys(variants); variant = keys[(keys.indexOf(variant)+step+keys.length)%keys.length]; render(); }
      function updateValue(value) { model.value = value; if (!below()) model.dispute = false; render(); const input = document.getElementById('value-input'); input.focus(); input.setSelectionRange(value.length,value.length); }
      function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.style.display = 'block'; clearTimeout(showToast.timer); showToast.timer = setTimeout(() => { toast.style.display = 'none'; },2500); }
      document.getElementById('previous').addEventListener('click',() => changeVariant(-1));
      document.getElementById('next').addEventListener('click',() => changeVariant(1));
      document.getElementById('state-select').addEventListener('change',event => { scenario = event.target.value; model = { ...scenarios[scenario] }; render(); });
      document.addEventListener('input',event => { if (event.target.id === 'value-input') updateValue(event.target.value); if (event.target.id === 'comment-input') model.comment = event.target.value; });
      document.addEventListener('change',event => { if (event.target.id === 'dispute-input') { model.dispute = event.target.checked; render(); } });
      document.addEventListener('click',event => { const action = event.target.closest('[data-action]')?.dataset.action; if (action === 'photo') { model.photo = true; render(); } if (action === 'remove-photo') { model.photo = false; render(); } if (action === 'save') showToast('Prototype only — nothing was saved.'); if (action === 'cancel' || action === 'close') showToast('Prototype only — switch examples to continue.'); });
      document.addEventListener('keydown',event => { if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return; if (event.key === 'ArrowLeft') changeVariant(-1); if (event.key === 'ArrowRight') changeVariant(1); });
      render();
    </script>
  </body>
</html>
